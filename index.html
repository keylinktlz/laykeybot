<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-bottom: 15px; color: #ef4444; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Thông Báo</h2>
        <p>Hôm nay đã hết slot, quay lại 7h ngày mai.</p>
    </div>

</body>
</html>
