<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lay Key Bot - Thoi gian dang dem nguoc</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
        }
        #countdown {
            font-size: 48px;
            font-weight: bold;
            color: #f43f5e;
            margin: 20px 0;
        }
        .btn {
            display: none;
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Xác Thực Lấy Key</h2>
        <p>Vui lòng đợi trong giây lát để hệ thống chuẩn bị liên kết...</p>
        <div id="countdown">5</div>
        
        <!-- Nút nhận key, link sẽ được JS tự động điền vào -->
        <a id="getLinkBtn" class="btn" href="#" target="_blank">NHẬN KEY NGAY</a>
    </div>

    <script>
        // Danh sách các link kiếm tiền của mày (Link4m, Gtraffic, Bumx, v.v.)
        const listLinks = [
            "https://link4m.com/LinkSo1CuaMay",
            "https://gtraffic.co/LinkSo2CuaMay",
            "https://bumx.vn/LinkSo3CuaMay",
            // Thêm bao nhiêu link tùy thích ở đây
        ];

        // Tự động chọn ngẫu nhiên 1 link trong mảng trên khi người dùng mở trang
        const randomLink = listLinks[Math.floor(Math.random() * listLinks.length)];
        document.getElementById('getLinkBtn').href = randomLink;

        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const btnEl = document.getElementById('getLinkBtn');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                document.querySelector('p').textContent = 'Đã hoàn tất! Bấm nút bên dưới để tiếp tục:';
                btnEl.style.display = 'inline-block';
            }
        }, 1000);
    </script>

</body>
</html>
