<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh vượt link nhận coin</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background: #f4f4f9; }
        .card { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .btn { background: #0088cc; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; display: none; text-decoration: none; }
        .timer { font-size: 24px; font-weight: bold; color: #d9534f; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Xác Minh Vượt Link</h2>
    <p>Vui lòng đợi 5 giây để nhận +1 Coin vào Telegram!</p>
    <div class="timer" id="timer">Vui lòng đợi 5 giây...</div>
    <button class="btn" id="claimBtn" onclick="sendReward()">🎁 BẤM ĐỂ NHẬN +1 COIN</button>
</div>

<script>
    // 1. Lấy Telegram ID từ URL (dạng: ?id=12345678)
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    // 2. ĐIỀN TOKEN BOT CỦA ÔNG VÀO ĐÂY
    const BOT_TOKEN = '9001402578:AAFr0uRt9VnpngXyUTlSsqqchvNtuBqL9GQ';

    let timeLeft = 5; // Đã đổi thành 5 giây theo ý ông
    const timerElem = document.getElementById('timer');
    const claimBtn = document.getElementById('claimBtn');

    const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            timerElem.innerText = `Vui lòng đợi ${timeLeft} giây...`;
        } else {
            clearInterval(countdown);
            timerElem.innerText = "✅ Bạn đã đủ điều kiện nhận Coin!";
            claimBtn.style.display = 'inline-block';
        }
    }, 1000);

    // 3. Web tự gọi thẳng Telegram API để gửi tin nhắn cộng coin cho user
    async function sendReward() {
        if (!userId) {
            alert("Lỗi: Không tìm thấy Telegram ID!");
            return;
        }

        claimBtn.disabled = true;
        claimBtn.innerText = "⏳ Đang xử lý...";

        try {
            // Nội dung tin nhắn bot sẽ gửi về cho user
            const message = "🎉 XÁC MINH THÀNH CÔNG!\n🎁 Bạn đã nhận được +1 Coin từ hệ thống.";
            const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${userId}&text=${encodeURIComponent(message)}\`;

            const res = await fetch(telegramUrl);
            const data = await res.json();
            if (data.ok) {
                alert("🎉 +1 Coin đã được cộng! Hãy quay lại Telegram kiểm tra tin nhắn từ bot.");
                window.location.href = "https://t.me/tlzlike_bot"; // Chuyển về lại bot
            } else {
                alert("⚠️ Có lỗi khi cộng coin, vui lòng thử lại!");
                claimBtn.disabled = false;
            }
        } catch (err) {
            alert("❌ Lỗi kết nối!");
            claimBtn.disabled = false;
        }
    }
</script>

</body>
</html>
