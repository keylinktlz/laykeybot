<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Lấy Key Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
        #countdown {
            font-size: 48px;
            font-weight: bold;
            color: #f43f5e;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .key-box {
            font-size: 20px;
            font-weight: bold;
            color: #22c55e;
            background: #0f172a;
            border: 2px dashed #22c55e;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <!-- Nội dung sẽ tự động thay đổi bằng JS -->
    </div>

    <script>
        // Danh sách 6 link rút gọn của mày
        const listLinks = [
            "https://link4m.org/RJWQ2YVy",
            "https://linkfree.click/s/key-nv2z1u19xrmvw898dc",
            "https://linkfree.click/s/key-nv3z1u19xrmvw89zfx",
            "https://linkfree.click/s/key-nv4z1u19xrmvw8asdj",
            "https://gtraffic.io/aQA6TPH",
            "https://gtraffic.io/dm6PKQH"
        ];

        // Lấy mã key từ bot truyền sang URL
        const urlParams = new URLSearchParams(window.location.search);
        const userKey = urlParams.get('key');
        const isDone = urlParams.get('status') === 'done';

        const mainCard = document.getElementById('mainCard');

        if (isDone && userKey) {
            // === KHI VƯỢT LINK XONG -> TỰ ĐỘNG CHUYỂN VỀ BOT `tlzlike_bot` ===
            mainCard.innerHTML = `
                <h2 style="color: #22c55e;">🎉 VƯỢT LINK THÀNH CÔNG!</h2>
                <p>Hệ thống đang tự động chuyển bạn về lại Telegram để cộng Coin...</p>
                <div class="key-box">${userKey}</div>
                <a href="https://t.me/tlzlike_bot?start=${userKey}" class="btn">🚀 BẤM ĐỂ NHẬN COIN NGAY</a>
            `;
            
            // Tự động đá về bot sau 1.5 giây
            setTimeout(() => {
                window.location.href = `https://t.me/tlzlike_bot?start=${userKey}`;
            }, 1500);

        } else {
            // === MỚI BẤM VÀO WEB -> ĐẾM NGƯỢC 5S & CHỌN LINK RÚT GỌN ===
            if (!userKey) {
                mainCard.innerHTML = `<h2>Lỗi!</h2><p>Vui lòng lấy link từ bot Telegram để xác thực.</p>`;
                throw new Error("Missing user key");
            }

            mainCard.innerHTML = `
                <h2>Xác Thực Lấy Key</h2>
                <p id="subText">Vui lòng đợi trong giây lát để hệ thống chuẩn bị liên kết...</p>
                <div id="countdown">5</div>
                <a id="getLinkBtn" class="btn" style="display: none;" href="#" target="_blank">NHẬN LINK VƯỢT NGAY</a>
            `;

            const randomLink = listLinks[Math.floor(Math.random() * listLinks.length)];
            const btnEl = document.getElementById('getLinkBtn');
            btnEl.href = randomLink;

            let timeLeft = 5;
            const countdownEl = document.getElementById('countdown');

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    document.getElementById('subText').textContent = 'Đã hoàn tất! Bấm nút bên dưới để tiếp tục vượt link:';
                    btnEl.style.display = 'inline-block';
                }
            }, 1000);
        }
    </script>

</body>
</html>
