<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Vượt Link - Free Fire</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-bottom: 15px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.5; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="card" id="content">
        <h2>Đang Xác Thực...</h2>
        <p id="status-text">Vui lòng đợi <span id="countdown" style="font-weight:bold; color:#38bdf8;">5</span> giây để hệ thống ghi nhận lượt vượt link.</p>
        <div class="spinner" id="loading-spinner"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const token = urlParams.get('token') || urlParams.get('key');

        const cardEl = document.getElementById('content');
        const statusTextEl = document.getElementById('status-text');
        const spinnerEl = document.getElementById('loading-spinner');
        const countdownEl = document.getElementById('countdown');

        // Nếu truy cập trực tiếp không có tham số từ bot
        if (!userId || !token) {
            showSlotError();
        } else {
            let timeLeft = 5;
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownEl.innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    verifyAndReward();
                }
            }, 1000);
        }

        async function verifyAndReward() {
            statusTextEl.innerText = "Đang gửi tín hiệu cộng coin về máy chủ...";

            // Thay link GAS Web App của mày vào đây
            const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL_HERE"; 

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verifyTokenKey',
                        userId: userId,
                        token: token
                    })
                });

                spinnerEl.style.display = 'none';
                cardEl.innerHTML = `
                    <h2 style="color: #22c55e;">🎉 Thành Công!</h2>
                    <p>Đã cộng <strong>+1 Coin</strong> vào tài khoản Telegram của bạn.</p>
                    <p style="font-size: 13px; color: #64748b;">Bạn có thể tắt trang này và quay lại Bot Telegram.</p>
                    <a href="https://t.me/TEN_BOT_CUA_MAY_BOT" class="btn">Quay lại Telegram</a>
                `;
            } catch (error) {
                showSlotError();
            }
        }

        function showSlotError() {
            spinnerEl.style.display = 'none';
            cardEl.innerHTML = `
                <h2 style="color: #ef4444;">Thông Báo</h2>
                <p>Hôm nay đã hết slot, quay lại 7h ngày mai.</p>
                <a href="https://t.me/TEN_BOT_CUA_MAY_BOT" class="btn">Quay lại Telegram</a>
            `;
        }
    </script>
</body>
</html>
