<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #121824;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            background-color: #2a1215;
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid #991b1b;
        }
        h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0 0 20px 0;
            color: #ffffff;
        }
        .notice-box {
            border: 2px dashed #ef4444;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            background-color: rgba(239, 68, 68, 0.05);
            overflow: hidden; /* Giúp chữ chạy mượt trong khung */
            white-space: nowrap;
        }
        /* Hiệu ứng chữ chạy */
        .marquee-text {
            display: inline-block;
            color: #ef4444;
            font-size: 15px;
            font-weight: 700;
            animation: marquee 8s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .btn-back {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #2a3447;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background-color: #1a2234;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">⚠️ Thông Báo</div>
        <h2>TRẠNG THÁI HỆ THỐNG</h2>
        
        <div class="notice-box">
            <div class="marquee-text">Hôm nay đã hết slot buff ngày mai quay lại sớm nhé !</div>
        </div>
        
        <a href="https://t.me/TEN_BOT_CUA_MAY_BOT" class="btn-back">← Quay lại Bot Telegram</a>
    </div>

</body>
</html>
